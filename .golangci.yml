version: "2"

run:
  timeout: 5m
  tests: true

linters:
  default: none
  enable:
    - bodyclose
    - copyloopvar
    - errcheck
    - errorlint
    - gocritic
    - gosec
    - govet
    - ineffassign
    - misspell
    - nilerr
    - revive
    - staticcheck
    - unconvert
    - unparam
    - unused
    - whitespace

  settings:
    gosec:
      excludes:
        - G104
    misspell:
      locale: US
      # Mosquitto is the canonical name of the eclipse-mosquitto broker;
      # without this whitelist misspell flags it as a typo of "mosquito".
      ignore-rules:
        - mosquitto
    revive:
      rules:
        - name: var-naming
        - name: exported
          disabled: true

  exclusions:
    rules:
      - path: _test\.go
        linters:
          - errcheck
          - gosec

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/debsahu/mqtt2db-go

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
