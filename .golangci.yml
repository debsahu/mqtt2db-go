run:
  timeout: 5m
  tests: true

linters:
  disable-all: true
  enable:
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - typecheck
    - unused
    - bodyclose
    - copyloopvar
    - errorlint
    - gocritic
    - gofmt
    - goimports
    - gosec
    - misspell
    - nilerr
    - revive
    - unconvert
    - unparam
    - whitespace

linters-settings:
  goimports:
    local-prefixes: github.com/debsahu/mqtt2db-go
  gosec:
    excludes:
      - G104
  misspell:
    locale: US
    ignore-words:
      # Mosquitto is the canonical name of the eclipse-mosquitto broker;
      # misspell defaults flag it as a typo of "mosquito".
      - mosquitto
  revive:
    rules:
      - name: var-naming
      - name: exported
        disabled: true

issues:
  exclude-rules:
    - path: _test\.go
      linters:
        - gosec
        - errcheck
  max-issues-per-linter: 0
  max-same-issues: 0
