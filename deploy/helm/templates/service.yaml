apiVersion: v1
kind: Service
metadata:
  name: {{ include "mqtt2db-go.fullname" . }}
  labels: {{- include "mqtt2db-go.labels" . | nindent 4 }}
spec:
  clusterIP: None  # headless: each pod gets a stable DNS entry
  selector: {{- include "mqtt2db-go.selectorLabels" . | nindent 4 }}
  ports:
    - name: metrics
      port: 9090
      targetPort: metrics
    - name: health
      port: 8080
      targetPort: health
